name: Enhance Commit Messages

on:
  push:
    branches: [main, master, beta, develop]
  workflow_dispatch:

concurrency:
  group: enhance-commits-${{ github.ref }}
  cancel-in-progress: true

jobs:
  enhance-commits:
    if: "!contains(github.event.head_commit.message, '[auto-enhanced]') && github.actor != 'github-actions[bot]'"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 5
          token: ${{ github.token }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Configure Git
        run: |
          git config user.name "GitHub Actions Commit Enhancer"
          git config user.email "actions@github.com"
      - name: Enhance commit message
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY || secrets.ZEN_API_TOKEN }}
        run: node .github/scripts/enhance-commits.js
