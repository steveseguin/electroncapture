name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v2.23.3)'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          package_version="$(node -p "require('./package.json').version")"
          requested_version="${REQUESTED_VERSION#v}"
          if [ "$requested_version" != "$package_version" ]; then
            echo "::error::Requested version $REQUESTED_VERSION does not match package.json version v$package_version"
            exit 1
          fi
          echo "Validated release version v$package_version"

      - name: Run regression tests
        run: npm test

  build-windows:
    needs: validate
    # node-gyp 10 does not recognize the Visual Studio 2026 image currently
    # selected by windows-latest. Keep the native ASIO build on VS 2022.
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: ${{ secrets.SUBMODULE_SSH_KEY != '' && 'recursive' || 'false' }}
          ssh-key: ${{ secrets.SUBMODULE_SSH_KEY }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: 'npm'

      - name: Restore Windows signing certificate
        shell: pwsh
        env:
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          WIN_CSC_PFX_BASE64: ${{ secrets.WIN_CSC_PFX_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WIN_CSC_PFX_BASE64)) {
            throw 'WIN_CSC_PFX_BASE64 is required for signed Windows builds.'
          }
          if ([string]::IsNullOrWhiteSpace($env:WIN_CSC_KEY_PASSWORD)) {
            throw 'WIN_CSC_KEY_PASSWORD is required for signed Windows builds.'
          }
          New-Item -ItemType Directory -Force -Path certs | Out-Null
          [System.IO.File]::WriteAllBytes(
            'certs/electroncapture.pfx',
            [System.Convert]::FromBase64String($env:WIN_CSC_PFX_BASE64)
          )

      - name: Install dependencies
        run: npm ci
        env:
          WINDOW_AUDIO_CAPTURE_SKIP: ${{ secrets.SUBMODULE_SSH_KEY == '' && '1' || '0' }}

      - name: Build Windows x64
        run: npm run build:win32
        env:
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          WINDOW_AUDIO_CAPTURE_SKIP: ${{ secrets.SUBMODULE_SSH_KEY == '' && '1' || '0' }}

      - name: Verify Windows x64 package
        run: npm run verify:win32
        env:
          WINDOW_AUDIO_CAPTURE_SKIP: ${{ secrets.SUBMODULE_SSH_KEY == '' && '1' || '0' }}

      - name: Verify Windows x64 signatures
        shell: powershell
        run: .\scripts\verify-windows-signatures.ps1 -Architecture x64

      - name: Submit executables to VirusTotal
        continue-on-error: true
        run: node scripts/submit-virustotal.js --dir dist --require-api-key --fail-on-error
        env:
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            dist/elecap_win_*_portable.zip
            dist/elecap_win_*_installer.zip
            dist/elecap-*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts (for workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: windows-builds
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/elecap_win_*_portable.zip
            dist/elecap_win_*_installer.zip
            dist/elecap-*.exe

  build-windows-arm64:
    needs: validate
    runs-on: windows-11-arm
    env:
      npm_config_arch: arm64
      ELECTRON_INSTALL_ARCH: arm64
      ELECTRON_ASIO_SKIP: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: ${{ secrets.SUBMODULE_SSH_KEY != '' && 'recursive' || 'false' }}
          ssh-key: ${{ secrets.SUBMODULE_SSH_KEY }}

      - name: Setup ARM64 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          architecture: arm64
          cache: 'npm'

      - name: Restore Windows signing certificate
        shell: pwsh
        env:
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          WIN_CSC_PFX_BASE64: ${{ secrets.WIN_CSC_PFX_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WIN_CSC_PFX_BASE64)) {
            throw 'WIN_CSC_PFX_BASE64 is required for signed Windows builds.'
          }
          if ([string]::IsNullOrWhiteSpace($env:WIN_CSC_KEY_PASSWORD)) {
            throw 'WIN_CSC_KEY_PASSWORD is required for signed Windows builds.'
          }
          New-Item -ItemType Directory -Force -Path certs | Out-Null
          [System.IO.File]::WriteAllBytes(
            'certs/electroncapture.pfx',
            [System.Convert]::FromBase64String($env:WIN_CSC_PFX_BASE64)
          )

      - name: Install dependencies
        run: npm ci
        env:
          WINDOW_AUDIO_CAPTURE_SKIP: ${{ secrets.SUBMODULE_SSH_KEY == '' && '1' || '0' }}

      - name: Build Windows ARM64
        run: npm run build:win-arm64
        env:
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          WINDOW_AUDIO_CAPTURE_SKIP: ${{ secrets.SUBMODULE_SSH_KEY == '' && '1' || '0' }}

      - name: Verify Windows ARM64 package
        run: npm run verify:win-arm64
        env:
          WINDOW_AUDIO_CAPTURE_SKIP: ${{ secrets.SUBMODULE_SSH_KEY == '' && '1' || '0' }}

      - name: Verify Windows ARM64 signatures
        shell: powershell
        run: .\scripts\verify-windows-signatures.ps1 -Architecture arm64

      - name: Submit executables to VirusTotal
        continue-on-error: true
        run: node scripts/submit-virustotal.js --dir dist --require-api-key --fail-on-error
        env:
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            dist/*win-arm64*.exe
            dist/*_arm64_*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts (for workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: windows-arm64-builds
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/*win-arm64*.exe
            dist/*_arm64_*.zip

  build-macos:
    needs: validate
    runs-on: macos-15
    env:
      CUSTOM_ELECTRON_SKIP: '1'
      ELECTRON_ASIO_SKIP: '1'
      WINDOW_AUDIO_CAPTURE_SKIP: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate macOS signing secrets
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          missing=()
          [ -n "$CSC_LINK" ] || missing+=("MAC_CSC_LINK")
          [ -n "$CSC_KEY_PASSWORD" ] || missing+=("MAC_CSC_KEY_PASSWORD")
          [ -n "$APPLE_ID" ] || missing+=("APPLE_ID")
          [ -n "$APPLE_TEAM_ID" ] || missing+=("APPLE_TEAM_ID")
          [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ] || missing+=("APPLE_APP_SPECIFIC_PASSWORD")
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing required macOS signing secrets: ${missing[*]}"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build, sign, and notarize macOS universal package
        run: npm run build:darwin -- --config.mac.forceCodeSigning=true
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}

      - name: Verify macOS package
        run: npm run verify:darwin
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            dist/*.dmg
            dist/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts (for workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: macos-universal-builds
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/*.dmg
            dist/*.zip

  build-linux:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          WINDOW_AUDIO_CAPTURE_SKIP: '1'

      - name: Build Linux
        run: npm run build:linux

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts (for workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: linux-builds
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm

  build-linux-arm64:
    needs: validate
    runs-on: ubuntu-24.04-arm
    env:
      npm_config_arch: arm64
      ELECTRON_INSTALL_ARCH: arm64
      WINDOW_AUDIO_CAPTURE_SKIP: '1'
      ELECTRON_ASIO_SKIP: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup ARM64 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          architecture: arm64
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Linux ARM64
        run: npm run build:arm64

      - name: Verify Linux ARM64 package
        run: npm run verify:linux-arm64

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            dist/*-arm64.AppImage
            dist/*-arm64.deb
            dist/*-aarch64.rpm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts (for workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-builds
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/*-arm64.AppImage
            dist/*-arm64.deb
            dist/*-aarch64.rpm
