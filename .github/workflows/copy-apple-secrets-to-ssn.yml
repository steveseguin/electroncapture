name: Copy Apple Secrets to SSN

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  copy-secrets:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
      MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
    steps:
      - name: Copy Apple signing secrets
        shell: bash
        run: |
          set -euo pipefail
          required=(GH_TOKEN APPLE_ID APPLE_TEAM_ID APPLE_APP_SPECIFIC_PASSWORD MAC_CSC_LINK MAC_CSC_KEY_PASSWORD)
          for name in "${required[@]}"; do
            if [ -z "${!name}" ]; then
              echo "::error::Required source secret is missing: $name"
              exit 1
            fi
          done

          signing_secrets=(APPLE_ID APPLE_TEAM_ID APPLE_APP_SPECIFIC_PASSWORD MAC_CSC_LINK MAC_CSC_KEY_PASSWORD)
          for name in "${signing_secrets[@]}"; do
            printf '%s' "${!name}" | gh secret set "$name" --repo steveseguin/ssn_app
          done
